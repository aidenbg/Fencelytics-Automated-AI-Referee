[project]
name = "fencelytics_public_repo"
version = "0.1.0"
requires-python = ">=3.10,<=3.12"
dependencies = [
    "filterpy>=1.4.5",
    "ipython>=8.39.0",
    "lap>=0.5.13",
    "matplotlib>=3.2.2",
    "mediapipe>=0.10.35",
    "numpy>=1.24.4,<2.0",
    "opencv-python>=4.1.1",
    "pandas>=1.1.4",
    "pillow>=7.1.2",
    "protobuf<4.21.3",
    "pyyaml>=5.3.1",
    "requests>=2.23.0",
    "rfdetr[loggers,train]>=1.8.3",
    "scikit-image>=0.24.0",
    "scipy>=1.4.1",
    "tqdm>=4.41.0",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "xgboost>=3.2.0",
    "seaborn>=0.11.0",
    "setuptools==70.2.0",
]

[dependency-groups]
dev = [
    "jupyter",
]
